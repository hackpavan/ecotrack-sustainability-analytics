<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoTrack Sustainability Analytics</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7f9;color:#111}.wrap{max-width:1500px;margin:auto;padding:28px}h1{margin:0 0 6px}.sub{color:#666;margin-bottom:18px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.filter,.kpi,.panel{background:#fff;border:1px solid #ddd;border-radius:12px}.filter{padding:12px}.filter label{display:block;font-weight:700;font-size:12px;margin-bottom:6px}select{width:100%;padding:9px}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.kpi{padding:18px}.kpi small{font-weight:700;color:#666}.kpi strong{display:block;font-size:28px;margin-top:8px}.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:12px}.grid2+.grid2{margin-top:12px}.panel{min-height:390px;padding:4px}.note{margin-top:16px;color:#666;font-size:13px}@media(max-width:900px){.filters,.kpis,.grid2{grid-template-columns:1fr 1fr}}@media(max-width:600px){.filters,.kpis,.grid2{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>EcoTrack — Sustainability & SaaS Analytics</h1><div class="sub">Synthetic portfolio dataset • Environmental + product analytics</div>
<div class="filters"><div class="filter"><label>INDUSTRY</label><select id="industry"><option>All</option></select></div><div class="filter"><label>COUNTRY</label><select id="country"><option>All</option></select></div><div class="filter"><label>PLAN</label><select id="plan"><option>All</option></select></div><div class="filter"><label>COMPANY SIZE</label><select id="size"><option>All</option></select></div></div>
<div class="kpis"><div class="kpi"><small>LATEST CO₂</small><strong id="co2">—</strong></div><div class="kpi"><small>AVG REDUCTION</small><strong id="reduction">—</strong></div><div class="kpi"><small>ACTIVE COMPANIES</small><strong id="companies">—</strong></div><div class="kpi"><small>CURRENT MRR</small><strong id="mrr">—</strong></div><div class="kpi"><small>CHURN RATE</small><strong id="churn">—</strong></div></div>
<div class="grid2"><div class="panel"><div id="industryChart"></div></div><div class="panel"><div id="sourceChart"></div></div></div><div class="grid2"><div class="panel"><div id="reductionChart"></div></div><div class="panel"><div id="engagementChart"></div></div></div>
<div class="note">All companies, activity data and emissions factors are synthetic and are provided only for analytics demonstration.</div></div>
<script>
const C='data/processed/companies_clean.csv',M='data/processed/monthly_sustainability_clean.csv';let companies=[],monthly=[];
function uniq(a,k){return[...new Set(a.map(x=>x[k]).filter(Boolean))].sort()}function add(id,v){let e=document.getElementById(id);v.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;e.appendChild(o)})}function money(v){if(v>=1e6)return'£'+(v/1e6).toFixed(2)+'M';if(v>=1e3)return'£'+(v/1e3).toFixed(1)+'K';return'£'+v.toFixed(0)}
function filtC(){return companies.filter(x=>(industry.value==='All'||x.Industry===industry.value)&&(country.value==='All'||x.Country===country.value)&&(plan.value==='All'||x.Plan===plan.value)&&(size.value==='All'||x.Company_Size===size.value))}
function render(){let cs=filtC(),ids=new Set(cs.map(x=>x.Company_ID)),maxMonth=monthly.reduce((a,b)=>a>b.Month?a:b.Month,'');let ms=monthly.filter(x=>ids.has(x.Company_ID)&&x.Month===maxMonth),co2=ms.reduce((a,b)=>a+Number(b.Total_CO2_kg||0),0)/1000,mrr=ms.reduce((a,b)=>a+Number(b.MRR||0),0),ch=cs.length?cs.filter(x=>Number(x.Churn_Flag)===1).length/cs.length:0,red=cs.length?cs.reduce((a,b)=>a+Number(b.Observed_Reduction_Pct||0),0)/cs.length:0;document.getElementById('co2').textContent=co2.toLocaleString(undefined,{maximumFractionDigits:0})+' t';document.getElementById('reduction').textContent=red.toFixed(1)+'%';document.getElementById('companies').textContent=ms.length.toLocaleString();document.getElementById('mrr').textContent=money(mrr);document.getElementById('churn').textContent=(ch*100).toFixed(1)+'%';
let ig={};ms.forEach(r=>ig[r.Industry]=(ig[r.Industry]||0)+Number(r.Total_CO2_kg||0)/1000);let ip=Object.entries(ig).sort((a,b)=>a[1]-b[1]);Plotly.react('industryChart',[{y:ip.map(x=>x[0]),x:ip.map(x=>x[1]),type:'bar',orientation:'h'}],{title:'Latest Emissions by Industry',xaxis:{title:'CO₂ tonnes'},margin:{l:135,r:20,t:55,b:55},paper_bgcolor:'white',plot_bgcolor:'white'},{responsive:true,displaylogo:false});
let src={Electricity:0,Gas:0,Fuel:0,Travel:0,Waste:0};ms.forEach(r=>{src.Electricity+=Number(r.Electricity_CO2_kg||0)/1000;src.Gas+=Number(r.Gas_CO2_kg||0)/1000;src.Fuel+=Number(r.Fuel_CO2_kg||0)/1000;src.Travel+=Number(r.Travel_CO2_kg||0)/1000;src.Waste+=Number(r.Waste_CO2_kg||0)/1000});Plotly.react('sourceChart',[{x:Object.keys(src),y:Object.values(src),type:'bar'}],{title:'Emissions by Source',yaxis:{title:'CO₂ tonnes'},margin:{l:60,r:20,t:55,b:70},paper_bgcolor:'white',plot_bgcolor:'white'},{responsive:true,displaylogo:false});
let bins={'Below 0%':0,'0–5%':0,'5–10%':0,'10%+':0};cs.forEach(x=>{let v=Number(x.Observed_Reduction_Pct||0);if(v<0)bins['Below 0%']++;else if(v<5)bins['0–5%']++;else if(v<10)bins['5–10%']++;else bins['10%+']++});Plotly.react('reductionChart',[{x:Object.keys(bins),y:Object.values(bins),type:'bar'}],{title:'Companies by Observed Reduction',yaxis:{title:'Companies'},margin:{l:60,r:20,t:55,b:70},paper_bgcolor:'white',plot_bgcolor:'white'},{responsive:true,displaylogo:false});
let bands={'0-2':[],'3-5':[],'6-8':[],'9-12':[],'13+':[]};cs.forEach(x=>{let v=Number(x.Avg_Monthly_Logins||0),b=v<=2?'0-2':v<=5?'3-5':v<=8?'6-8':v<=12?'9-12':'13+';bands[b].push(x)});let bk=Object.keys(bands),bv=bk.map(k=>bands[k].length?bands[k].filter(x=>Number(x.Churn_Flag)===1).length/bands[k].length*100:0);Plotly.react('engagementChart',[{x:bk,y:bv,type:'bar'}],{title:'Churn by Platform Engagement',xaxis:{title:'Avg Monthly Logins'},yaxis:{title:'Churn Rate (%)'},margin:{l:60,r:20,t:55,b:70},paper_bgcolor:'white',plot_bgcolor:'white'},{responsive:true,displaylogo:false});}
Promise.all([new Promise(ok=>Papa.parse(C,{download:true,header:true,dynamicTyping:true,complete:r=>{companies=r.data.filter(x=>x&&x.Company_ID);ok()}})),new Promise(ok=>Papa.parse(M,{download:true,header:true,dynamicTyping:true,complete:r=>{monthly=r.data.filter(x=>x&&x.Company_ID);ok()}}))]).then(()=>{add('industry',uniq(companies,'Industry'));add('country',uniq(companies,'Country'));add('plan',uniq(companies,'Plan'));add('size',uniq(companies,'Company_Size'));['industry','country','plan','size'].forEach(id=>document.getElementById(id).addEventListener('change',render));render()});
</script></body></html>
